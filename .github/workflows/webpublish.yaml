name: 8Q-Gh-Pages

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.27.4'
          channel: 'stable'
      - uses: bluefireteam/flutter-gh-pages@v9
        with:
          workingDir: eightqueens
          baseHref: /mobile/
